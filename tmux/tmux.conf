# Configuración base de tmux

# Recargar configuración
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Habilitar mouse
set -g mouse on

# Barra de estado arriba
set -g status-position top

# Vim motion
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Set indexes to 1
set-option -g base-index 1
set-option -g pane-base-index 1

# True colors support
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# Update every second
set -g status-interval 1

# Renombrar ventanas automáticamente con el nombre del programa
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_command}'

# Popups
bind-key -n C-g display-popup -E -w 85% -h 85% -d '#{pane_current_path}' "lazygit"
bind-key i display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "conda run -n calc --no-capture-output python -m IPython"

# === Theme: colores generados por Omarchy ==================================
# El archivo tmux-theme.conf es regenerado por Omarchy con la paleta del tema
# activo al ejecutar `omarchy theme set`. Los colores están horneados, así que
# recargar esta configuración aplica el tema actual.
source-file ~/.local/state/omarchy/current/theme/tmux-theme.conf