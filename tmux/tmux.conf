# Configuración base de tmux (sin colores)

# Recargar configuración
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Habilitar mouse
set -g mouse on

# Barra de estado arriba
set -g status-position top

# Vim motion
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Set indexes to 1
set-option -g base-index 1
set-option -g pane-base-index 1

# True colors support
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# Update every second
set -g status-interval 1

# Renombrar ventanas automáticamente con el nombre del programa
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_command}'

# Popups
bind-key -n C-g display-popup -E -w 85% -h 85% -d '#{pane_current_path}' "lazygit"
bind-key i display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "conda run -n calc --no-capture-output python -m IPython"
# Catppuccin Mocha Theme para tmux

# Colores
thm_bg="#1e1e2e"
thm_fg="#cdd6f4"
thm_cyan="#89dceb"
thm_black="#181825"
thm_gray="#313244"
thm_magenta="#cba6f7"
thm_pink="#f5c2e7"
thm_red="#f38ba8"
thm_green="#a6e3a1"
thm_yellow="#f9e2af"
thm_blue="#89b4fa"
thm_orange="#fab387"
thm_black4="#585b70"

# Status bar
set -g status-style "bg=${thm_bg},fg=${thm_fg}"
set -g status-left-length 100
set -g status-right-length 100

# Formato de la barra de estado
set -g status-left "#[fg=${thm_bg},bg=${thm_blue},bold] #S #[fg=${thm_blue},bg=${thm_bg}]"
set -g status-right "#[fg=${thm_gray},bg=${thm_bg}]#[fg=${thm_fg},bg=${thm_gray}] %a %d-%m #[fg=${thm_blue},bg=${thm_gray}]#[fg=${thm_bg},bg=${thm_blue},bold] %H:%M:%S "

# Ventanas
set -g window-status-format "#[fg=${thm_fg},bg=${thm_bg}] #I #W "
set -g window-status-current-format "#[fg=${thm_bg},bg=${thm_magenta},bold] #I #W "
set -g window-status-separator ""

# Bordes de paneles
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"
set -g popup-border-lines "rounded"

# Mensajes
set -g message-style "bg=${thm_orange},fg=${thm_bg}"
set -g message-command-style "bg=${thm_orange},fg=${thm_bg}"

# Modo de copia
set -g mode-style "bg=${thm_yellow},fg=${thm_bg}"
