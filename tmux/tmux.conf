unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g mouse on
set -g status-position top

# Vim motion
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Set indexes to 1
set-option -g base-index 1
set-option -g pane-base-index 1

# True colors suport
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# Update every second
set -g status-interval 1

# Renombrar ventanas automáticamente con el nombre del programa
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_command}'

# Catppuccin Mocha colors
CATPPUCCIN_BASE="#1e1e2e"
CATPPUCCIN_SURFACE0="#313244"
CATPPUCCIN_SURFACE1="#45475a"
CATPPUCCIN_OVERLAY0="#6c7086"
CATPPUCCIN_TEXT="#cdd6f4"
CATPPUCCIN_BLUE="#89b4fa"
CATPPUCCIN_MAUVE="#cba6f7"
CATPPUCCIN_LAVENDER="#b4befe"
CATPPUCCIN_SAPPHIRE="#74c7ec"

# Status bar style
set -g status-style "bg=${CATPPUCCIN_BASE},fg=${CATPPUCCIN_TEXT}"
set -g status-left-length 100
set -g status-right-length 100

# Left side - empty o puedes añadir algo
set -g status-left ""

# Right side - session name + date/time
set -g status-right "#[fg=${CATPPUCCIN_OVERLAY0}]#S #[fg=${CATPPUCCIN_SAPPHIRE}] %a, %d-%m %H:%M:%S"

# Window status format (ventanas inactivas)
set -g window-status-format "#[fg=${CATPPUCCIN_OVERLAY0},bg=${CATPPUCCIN_BASE}] #I #W "

# Window status current format (ventana activa)
set -g window-status-current-format "#[fg=${CATPPUCCIN_BASE},bg=${CATPPUCCIN_MAUVE},bold] #I #W "

# Pane borders
set -g pane-border-style "fg=${CATPPUCCIN_SURFACE1}"
set -g pane-active-border-style "fg=${CATPPUCCIN_BLUE}"

# Popup style
set -g popup-border-style "fg=${CATPPUCCIN_BLUE},bold"
set -g popup-border-lines "rounded"

# Message style
set -g message-style "bg=${CATPPUCCIN_SURFACE0},fg=${CATPPUCCIN_TEXT}"
set -g message-command-style "bg=${CATPPUCCIN_SURFACE0},fg=${CATPPUCCIN_TEXT}"

# Popups
bind-key -n C-g display-popup -E -w 85% -h 85% -d '#{pane_current_path}' "lazygit"
bind-key -n C-t display-popup -E -w 85% -h 85% "btop"
bind-key i display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "conda run -n calc --no-capture-output python -m IPython"
