unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g mouse on
set -g status-position top

# Vim motion
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Set indexes to 1
set-option -g base-index 1
set-option -g pane-base-index 1

# True colors suport
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# Update every second
set -g status-interval 1

# Status bar
set -g status-style bg=default
set -g status-left ""
set -g status-right "#[fg=black,bright]#S"
set -g window-status-current-style "#{?window_zoomed_flag,bg=magenta,fg=gray,fg=blue,nobold}"

set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "

# Show session name on the right + clock
set -g status-right "#[fg=brightblack]#S #[fg=cyan] %a,%d-%m %H:%M:%S"

# Popup style
set -g popup-border-style "fg=#89b4fa,bold"
set -g popup-border-lines "rounded"

# Popups
bind-key -n C-g display-popup -E -w 85% -h 85% -d '#{pane_current_path}' "lazygit"
bind-key -n C-t display-popup -E -w 85% -h 85% "btop"
